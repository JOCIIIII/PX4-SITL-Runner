# X8 (A4VAI, 2026-10-31): = fast_lio_mid360_x500.yaml (mid360_a4vai.yaml, the file that flew on the X500) with
# blind 0.9 m: the X8's arms and props reach 0.77 m from the centre (scripts/dev/livox_bench_check.py), the X500's 0.55 m.
# A4VAI onboard (Jetson Orin Nano) - Livox Mid-360 with its built-in IMU, livox_ros_driver2 xfer_format 0 (PointCloud2).
# Differences from mid360.yaml: PointCloud2 input with per-point times (lidar_type 4, A4VAI patch in mid360_handler),
# blind 0.6 m (the X500's own returns reach 0.55 m from the centre), fixed IMU-lidar extrinsic, no map / path / PCD output.
/**:
    ros__parameters:
        feature_extract_enable: false
        point_filter_num: 3
        max_iteration: 3
        filter_size_surf: 0.5
        filter_size_map: 0.5
        cube_side_length: 1000.0
        runtime_pos_log_enable: false
        map_file_path: "./test.pcd"

        common:
            lid_topic:  "/livox/lidar"
            imu_topic:  "/livox/imu"
            time_sync_en: false
            time_offset_lidar_to_imu: 0.0

        preprocess:
            lidar_type: 4                # MID360: livox_ros_driver2 PointCloud2
            scan_line:  4
            blind: 0.9   # X8: own returns to 0.77 m
            timestamp_unit: 3
            scan_rate: 10

        mapping:
            acc_cov: 0.1
            gyr_cov: 0.1
            b_acc_cov: 0.0001
            b_gyr_cov: 0.0001
            fov_degree:    360.0
            det_range:     100.0
            extrinsic_est_en:  false     # the built-in IMU sits at a fixed, known offset
            extrinsic_T: [ -0.011, -0.02329, 0.04412 ]
            extrinsic_R: [ 1., 0., 0.,
                            0., 1., 0.,
                            0., 0., 1.]

        publish:
            path_en: false
            effect_map_en: false
            map_en: false
            scan_publish_en:  true       # /cloud_registered (world frame) for Foxglove
            dense_publish_en: false
            scan_bodyframe_pub_en: false

        pcd_save:
            pcd_save_en: false
            interval: -1
